name: Deploy auf GitHub Pages

on:
  push:
    branches: ['**']
  # Erlaubt einen manuellen Start über den Actions-Tab — auch von einem anderen Branch
  workflow_dispatch:
  # Täglicher Lauf: Der Bild-Aufloeser übernimmt das zuletzt veröffentlichte
  # Manifest als Basis und füllt nur die Lücken — so wird die Bildliste von
  # selbst vollständig, auch wenn Jikan/Wikipedia an einzelnen Tagen drosseln.
  schedule:
    - cron: '23 4 * * *'

# Rechte, die die Pages-Bereitstellung braucht
permissions:
  contents: read
  pages: write
  id-token: write

# Ein laufender Deploy wird nicht abgebrochen, Nachfolger warten
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # Veröffentlicht wird nur der Standard-Branch des Repositorys — egal wie er
    # heißt. Ein fest verdrahtetes „main" würde hier nie auslösen, weil dieses
    # Repository einen anderen Standard-Branch hat.
    if: github.event_name != 'push' || github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci

      # Content-Gate: Ohne bestandene Regelprüfung wird nichts veröffentlicht.
      - name: Content prüfen
        run: npm run validate

      # Löst alle Profilbilder fest auf (Jikan/MyAnimeList + Wikipedia) und
      # backt sie als public/photos.json in den Build. Das Log zeigt jeden
      # Treffer — bricht nie ab, fehlende Einträge fallen auf die
      # Laufzeit-Suche und die Zeichnungen zurück.
      - name: Profilbilder auflösen (Jikan + Wikipedia)
        run: node scripts/resolve-photos.mjs

      - name: Build
        run: npx vite build

      # GitHub Pages liefert bei unbekannten Pfaden 404.html aus. Der Router
      # arbeitet mit Hashes, deshalb genügt eine Kopie der index.html.
      - name: SPA-Fallback anlegen
        run: cp dist/index.html dist/404.html

      # Pages lässt sich nicht aus dem Workflow heraus aktivieren: Der
      # GITHUB_TOKEN darf keine Pages-Site anlegen. Ohne diesen Vorabcheck
      # bricht configure-pages mit einem nichtssagenden „Not Found" ab.
      - name: Ist GitHub Pages aktiviert?
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          status=$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages")
          if [ "$status" = "404" ]; then
            echo "::error title=GitHub Pages ist noch nicht aktiviert::Einmalig einrichten: Settings → Pages → Build and deployment → Source auf 'GitHub Actions' stellen. Danach diesen Workflow unter Actions erneut starten."
            exit 1
          fi
          echo "Pages ist aktiviert (HTTP $status)."

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
